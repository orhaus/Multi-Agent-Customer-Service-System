<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Agent Customer Service</title>
<style>
  :root {
    --bg: #0f1116;
    --panel: #171a21;
    --line: #262b36;
    --text: #e6e8ed;
    --muted: #8b93a3;
    --customer: #1e2531;
    --accent: #6ea8fe;
    --warn: #e0a458;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }

  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
  }
  /* Message on the left, how it was decided on the right. */
  .exchange {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 18px;
    margin-bottom: 22px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .exchange { grid-template-columns: minmax(0, 1fr); }
  }

  .trace {
    border-left: 2px solid var(--line);
    padding-left: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .trace .step { margin-bottom: 12px; }
  .trace .label {
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: 10px;
    color: #6b7383;
    margin-bottom: 3px;
  }
  .trace .headline { color: var(--text); font-size: 13px; }
  .trace .reasoning { font-style: italic; margin-top: 3px; }

  /* The confidence bar: fill against a marked threshold, so a reader can see
     an answer fall short of the line rather than be told it did. */
  .bar {
    position: relative;
    height: 6px;
    background: #22262f;
    border-radius: 3px;
    margin: 6px 0 4px;
  }
  .bar .fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .bar .fill.below { background: var(--warn); }
  .bar .threshold {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: var(--muted);
  }
  .bar-legend { display: flex; justify-content: space-between; font-size: 10px; }

  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    border: 1px solid var(--line);
  }
  .badge.ok { color: #7fd4a0; border-color: #2d4a3a; }
  .badge.declined { color: var(--warn); border-color: #4a3b24; }
  .badge.failed { color: #e08a8a; border-color: #4a2a2a; }

  .tool { margin-top: 4px; padding-left: 10px; border-left: 1px solid var(--line); }
  .tool code { color: #bcd0f0; font-size: 11px; }
  .tool .result { color: #6b7383; font-size: 11px; overflow-wrap: anywhere; }

  .arrow { color: var(--warn); margin: 6px 0; }
  .trace .footer { color: #5c6371; font-size: 10px; margin-top: 10px; }

  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .customer .bubble {
    background: var(--customer);
    margin-left: auto;
    max-width: 80%;
    width: fit-content;
  }
  .support .bubble { background: var(--panel); border: 1px solid var(--line); }
  .error .bubble { background: #2a1a1a; border: 1px solid #573; border-color: #6b3232; }

  .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .customer .who { text-align: right; }

  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .meta .escalated { color: var(--warn); }

  .handoff {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }

  #composer {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  #message {
    flex: 1;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font: inherit;
  }
  #message:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 0 20px;
    border-radius: 8px;
    border: 0;
    background: var(--accent);
    color: #0b0d12;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }

  .thinking { color: var(--muted); font-size: 13px; }
  .thinking::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>

<header>
  <h1>Multi-Agent Customer Service</h1>
  <span>billing &amp; technical specialists, with escalation to a human</span>
</header>

<div id="transcript"></div>

<form id="composer">
  <input id="message" autocomplete="off" placeholder="Describe your problem…" required>
  <button type="submit">Send</button>
</form>

<script>
const transcript = document.getElementById("transcript");
const composer = document.getElementById("composer");
const input = document.getElementById("message");
const button = composer.querySelector("button");

// The server is stateless: we hold the conversation and send it back each turn.
// Null means the next message starts a fresh one - which is what we want after
// an escalation, because a person owns that conversation now.
let conversation = null;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function addExchange(who, label, text, className) {
  const block = el("div", `exchange ${who} ${className || ""}`);
  const column = el("div", "message");
  column.append(el("div", "who", label), el("div", "bubble", text));
  block.append(column, el("div", "trace"));
  transcript.append(block);
  transcript.scrollTop = transcript.scrollHeight;
  return block;
}

function confidenceBar(confidence, threshold) {
  const wrap = el("div");
  const bar = el("div", "bar");

  const fill = el("div", "fill");
  fill.style.width = `${Math.round(confidence * 100)}%`;
  if (threshold !== null && confidence < threshold) fill.classList.add("below");
  bar.append(fill);

  if (threshold !== null && threshold !== undefined) {
    const marker = el("div", "threshold");
    marker.style.left = `${Math.round(threshold * 100)}%`;
    marker.title = `threshold ${threshold}`;
    bar.append(marker);
  }

  const legend = el("div", "bar-legend");
  legend.append(
    el("span", null, `confidence ${confidence.toFixed(2)}`),
    el("span", null, threshold === null ? "" : `threshold ${threshold}`),
  );

  wrap.append(bar, legend);
  return wrap;
}

// Raw JSON cut to a character count ends mid-key and reads as a rendering bug.
// Describe the shape instead: a list becomes its length, a nested object a
// placeholder, and anything still too long is cut at a comma with an ellipsis.
function summariseResult(result) {
  if (result === null || typeof result !== "object") return String(result);
  if (result.error) return `error: ${result.error}`;

  const parts = Object.entries(result).map(([key, value]) => {
    if (Array.isArray(value)) return `${key}: ${value.length} item${value.length === 1 ? "" : "s"}`;
    if (value !== null && typeof value === "object") return `${key}: {…}`;
    return `${key}: ${value}`;
  });

  const text = parts.join(", ");
  if (text.length <= 110) return text;

  const cut = text.slice(0, 110);
  const lastComma = cut.lastIndexOf(",");
  return `${(lastComma > 40 ? cut.slice(0, lastComma) : cut).trimEnd()}…`;
}

function toolNode(tool) {
  const node = el("div", "tool");
  const args = Object.entries(tool.arguments || {})
    .map(([key, value]) => `${key}=${JSON.stringify(value)}`)
    .join(", ");
  node.append(el("code", null, `${tool.name}(${args})`));

  const failed = Boolean(tool.result && tool.result.error);
  const result = el("div", "result", `→ ${summariseResult(tool.result)}`);
  if (failed) result.style.color = "#e08a8a";
  // The full result is a hover away, so summarising loses nothing.
  result.title = JSON.stringify(tool.result, null, 2);
  node.append(result);
  return node;
}

function agentNode(step, index) {
  const node = el("div", "step");
  node.append(el("div", "label", index === 0 ? "specialist" : "re-routed to"));

  const headline = el("div", "headline");
  headline.append(el("span", null, `${step.category} `));
  if (step.failed) headline.append(el("span", "badge failed", "failed"));
  else if (step.handled) headline.append(el("span", "badge ok", "handled"));
  else headline.append(el("span", "badge declined", `declined → ${step.suggested_category}`));
  node.append(headline);

  (step.tools || []).forEach((tool) => node.append(toolNode(tool)));
  return node;
}

function renderTrace(container, trace, resolution) {
  container.replaceChildren();
  if (!trace) return;

  if (trace.route) {
    const step = el("div", "step");
    step.append(
      el("div", "label", "router"),
      el("div", "headline", trace.route.category),
      confidenceBar(trace.route.confidence, trace.confidence_threshold ?? null),
      el("div", "reasoning", `“${trace.route.reasoning}”`),
    );
    container.append(step);
  } else {
    const step = el("div", "step");
    step.append(
      el("div", "label", "router"),
      el("div", "reasoning", "skipped — a specialist already had this conversation"),
    );
    container.append(step);
  }

  (trace.agents || []).forEach((step, index) => {
    if (index > 0) container.append(el("div", "arrow", "↓"));
    container.append(agentNode(step, index));
  });

  if (resolution && resolution.escalated) {
    const headline = el("div", "headline");
    headline.append(el("span", "badge declined", `human · ${trace.escalation_reason}`));

    const step = el("div", "step");
    step.append(el("div", "label", "outcome"), headline);
    container.append(step);
  }

  if (trace.seconds) container.append(el("div", "footer", `${trace.seconds.toFixed(2)}s`));
}

function describe(resolution) {
  if (resolution.escalated) {
    const detail = `handed to a human · ${resolution.escalation_reason}`;
    return resolution.rerouted_from ? `${detail} · rerouted from ${resolution.rerouted_from}` : detail;
  }
  const detail = `answered by ${resolution.category}`;
  return resolution.rerouted_from ? `${detail} · rerouted from ${resolution.rerouted_from}` : detail;
}

async function send(text) {
  const response = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, conversation }),
  });
  if (!response.ok) throw new Error(`the server returned ${response.status}`);
  return response.json();
}

// Enter sends. preventDefault first so this replaces the browser's implicit
// form submission rather than firing alongside it.
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    composer.requestSubmit();
  }
});

composer.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addExchange("customer", "you", text);
  input.value = "";
  input.disabled = button.disabled = true;

  const pending = addExchange("support", "support", "");
  pending.querySelector(".bubble").replaceChildren(el("span", "thinking", "thinking"));

  try {
    const data = await send(text);
    conversation = data.resolution.escalated ? null : data.conversation;

    const column = pending.querySelector(".message");
    column.querySelector(".bubble").textContent = data.resolution.reply;

    const meta = el("div", "meta", describe(data.resolution));
    if (data.resolution.escalated) meta.classList.add("escalated");
    column.append(meta);

    if (data.resolution.escalated) {
      column.append(el("div", "handoff", "A person has this conversation now. Your next message starts a new one."));
    }

    renderTrace(pending.querySelector(".trace"), data.trace, data.resolution);
  } catch (error) {
    pending.classList.add("error");
    pending.querySelector(".message .bubble").textContent =
      `Could not reach the support system — ${error.message}`;
  } finally {
    input.disabled = button.disabled = false;
    input.focus();
    transcript.scrollTop = transcript.scrollHeight;
  }
});

input.focus();
</script>

</body>
</html>
